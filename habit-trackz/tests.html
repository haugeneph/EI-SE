<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Trackz — Tests</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem 4rem;
      background: #f8faff; color: #0f172a;
    }
    h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
    .sub { color: #64748b; font-size: 0.875rem; margin: 0 0 1.5rem; }
    .summary {
      border-radius: 0.75rem; padding: 0.9rem 1.1rem; font-weight: 600;
      margin-bottom: 1.25rem;
    }
    .summary.pass { background: #d7f6e7; color: #006c49; }
    .summary.fail { background: #ffdad6; color: #ba1a1a; }
    ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.4rem; }
    li {
      display: flex; gap: 0.7rem; align-items: flex-start;
      background: #fff; border: 1px solid #e2e8f0; border-radius: 0.625rem;
      padding: 0.65rem 0.85rem; font-size: 0.875rem;
    }
    li.fail { border-color: #ffdad6; background: #fff6f5; }
    .mark { font-weight: 700; }
    li.pass .mark { color: #10b981; }
    li.fail .mark { color: #ba1a1a; }
    small { display: block; color: #ba1a1a; margin-top: 0.2rem; }
    a { color: #006c49; }
    code { background: #e6ebfb; padding: 0.1rem 0.35rem; border-radius: 0.3rem; font-size: 0.8125rem; }
  </style>
</head>
<body>
  <h1>Unit-Tests: Streak-Algorithmus</h1>
  <p class="sub">
    Testet <code>js/streak.js</code> ohne Oberfläche und ohne Datenbank.
    Im Terminal ebenfalls lauffähig mit <code>node js/tests.js</code>.
    · <a href="index.html">zurück zur App</a>
  </p>
  <p class="summary" id="summary">Tests laufen …</p>
  <ul id="results"></ul>

  <script src="js/streak.js"></script>
  <script src="js/tests.js"></script>
</body>
</html>
